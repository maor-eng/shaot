
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="איסוף שעות">
<title>איסוף שעות — מאור הנדסה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; direction: rtl; background: #f4f6fb; color: #1a1a2e; font-size: 16px; }
  .header { background: #1F3864; color: #fff; padding: 14px 16px; text-align: center; font-size: 17px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
  .header span { font-size: 13px; font-weight: normal; opacity: 0.8; display: block; margin-top: 2px; }
  .nav { display: flex; background: #fff; border-bottom: 1px solid #dde3f0; }
  .nav-btn { flex: 1; padding: 11px; background: none; border: none; font-size: 14px; font-family: Arial, sans-serif; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
  .nav-btn.active { color: #1F3864; border-bottom-color: #1F3864; font-weight: bold; }
  .page { display: none; padding: 12px; }
  .page.active { display: block; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .card h2 { font-size: 15px; color: #1F3864; margin-bottom: 12px; text-align: center; }
  .field { margin-bottom: 10px; }
  .field label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid #d0d7e8; border-radius: 8px; font-size: 15px; font-family: Arial, sans-serif; background: #fff; color: #1a1a2e; -webkit-appearance: none; }
  .meta-row { display: flex; gap: 8px; }
  .meta-row .field { flex: 1; }
  .row-card { background: #f4f6fb; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
  .row-card > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .row-card input, .row-card select { width: 100%; padding: 7px 9px; border: 1px solid #d0d7e8; border-radius: 7px; font-size: 14px; font-family: Arial, sans-serif; background: #fff; color: #1a1a2e; -webkit-appearance: none; }
  .del-btn { background: none; border: none; color: #c0392b; font-size: 22px; cursor: pointer; padding: 2px 4px; line-height: 1; margin-top: 4px; }
  .add-btn { width: 100%; padding: 10px; background: #e8f0fb; color: #1F3864; border: 1px solid #b8cce8; border-radius: 8px; font-size: 15px; font-family: Arial, sans-serif; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
  .save-btn { width: 100%; padding: 13px; background: #1F3864; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-family: Arial, sans-serif; cursor: pointer; font-weight: bold; }
  .save-btn:disabled { background: #8a9ab5; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #eef1f8; font-size: 14px; }
  .summary-row:last-child { border-bottom: none; }
  .badge { font-size: 12px; background: #e8f0fb; color: #1F3864; padding: 3px 10px; border-radius: 20px; font-weight: bold; white-space: nowrap; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 20px 0; }
  .proj-code { font-size: 11px; color: #888; margin-top: 1px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 11px 22px; border-radius: 8px; font-size: 14px; font-family: Arial; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99; white-space: nowrap; }
  .toast.success { background: #1F3864; color: #fff; }
  .toast.error { background: #c0392b; color: #fff; }
  .sending { text-align: center; color: #1F3864; font-size: 14px; padding: 8px 0; }
  .status-bar { background: #fff7e6; border: 1px solid #f0c060; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #8a6000; text-align: center; display: none; }
</style>
</head>
<body>

<div class="header">
  מאור הנדסה
  <span>איסוף שעות לפי פרוייקטים</span>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-entry" onclick="showPage('entry')">✏️ הזנה</button>
  <button class="nav-btn" id="nav-summary" onclick="showPage('summary')">📊 סיכום</button>
</div>

<div id="page-entry" class="page active">
  <div id="status-bar" class="status-bar"></div>
  <div class="card">
    <h2>פרטי הדיווח</h2>
    <div class="meta-row">
      <div class="field">
        <label>תאריך</label>
        <input type="date" id="date-input">
      </div>
      <div class="field">
        <label>מחלקה</label>
        <input type="text" id="dept-input" placeholder="שם מחלקה">
      </div>
    </div>
    <div class="field">
      <label>מנהל מחלקה</label>
      <input type="text" id="manager-input" placeholder="שם מנהל">
    </div>
  </div>

  <div class="card">
    <h2>שורות עובדים</h2>
    <div id="rows-list"></div>
    <button class="add-btn" onclick="addRow()">+ הוסף עובד</button>
    <div id="sending-msg" class="sending" style="display:none">שולח לגיליון... ⏳</div>
    <button class="save-btn" id="save-btn" onclick="saveAll()">💾 שמור ב-Google Sheets</button>
  </div>
</div>

<div id="page-summary" class="page">
  <div class="card">
    <h2>סיכום לפי פרויקט</h2>
    <div id="summary-content"></div>
  </div>
  <div class="card">
    <h2>כל הרשומות</h2>
    <div id="all-rows-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SHEET_URL = "https://script.google.com/macros/s/AKfycbyGt0kSyNa7c31ammW5aQDUOhsPA9oW7I6MlPjEjqZt03kHDWTR3J_YADrFyMmkDiKwHw/exec";

var PROJECTS = [
  {code:"AL02", name:"שוט בלסטינג"},
  {code:"AM47", name:"מסנן MFD250"},
  {code:"AMG01", name:"אירומגנזיום"},
  {code:"AMG01", name:"תוספת"},
  {code:"DP01", name:"די אף אם פאוור"},
  {code:"EL03-1", name:"אלאופ"},
  {code:"EL11", name:"מערכת הרמה"},
  {code:"EL12", name:"מנגנון מיקוד"},
  {code:"EL13", name:"שני מתקני הנפה"},
  {code:"ELT01-1", name:"תעש מע' בדיקת לחץ"},
  {code:"ELT01-2", name:"תעש מע' בדיקת לחץ"},
  {code:"ELT06", name:"שתת אחורי"},
  {code:"ELT10", name:"דלתות למנהרת אקלום"},
  {code:"ELT12", name:"עגלה לרנטגן"},
  {code:"ELT17", name:"מכבש לחיצת בלוק"},
  {code:"ELT18-1", name:""},
  {code:"ELT19", name:"בדיקת לחץ MK"},
  {code:"ELT20", name:"לחיצה ומשיכה"},
  {code:"ELT21", name:"שדרוג מסוע שלהם"},
  {code:"ELT22", name:"תא אוטומטי לחצב"},
  {code:"ELT23", name:"הרכבת פגזים"},
  {code:"ELT24", name:"בדיקת וואקום"},
  {code:"ELT107", name:"דפינה"},
  {code:"ELT108", name:"שני מתקני דפינה"},
  {code:"ELT200", name:"תעש שוט פינינג"},
  {code:"ELT201", name:"תעש סין"},
  {code:"ELT202", name:"תעש שוט בלסטינג"},
  {code:"ELY01", name:"אלביט יבשה טורבינות"},
  {code:"GPL10", name:"טעינה ופריקה"},
  {code:"KC01", name:"כתר קנדה מבדקת אינדורנס"},
  {code:"KC02", name:"כתר קנדה מבדקת גלגלים"},
  {code:"KMG07", name:"סגירת חביות"},
  {code:"KP12", name:"מתקן הפלה"},
  {code:"KP14", name:"העברת מתקן כסא"},
  {code:"LR01", name:"לוריאל"},
  {code:"MA03", name:"שעות מסגריה כללי"},
  {code:"PLG07", name:"פלסגד אנטי סליפ"},
  {code:"RAF103", name:"שתי במות 445"},
  {code:"RAF103-1", name:"ארבע עגלות"},
  {code:"RAF201", name:"מול ההר גשר הרעדה"},
  {code:"UV01", name:"תא רובוטי"},
  {code:"WM04", name:"מהפך מיכלים"},
  {code:"YR01", name:"יהודה רשתות"}
];

var rows = [];
var lastSavedRows = [];
document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

function addRow() {
  rows.push({ name: '', projectIdx: '', hours: '' });
  render();
  setTimeout(function() {
    var inputs = document.querySelectorAll('.r-name');
    if (inputs.length) inputs[inputs.length-1].focus();
  }, 50);
}

function delRow(i) {
  rows.splice(i, 1);
  render();
}

function updateRow(i, field, val) {
  rows[i][field] = val;
}

function getProj(idx) {
  if (idx === '' || idx === null || idx === undefined) return null;
  return PROJECTS[parseInt(idx)];
}

function render() {
  var list = document.getElementById('rows-list');
  if (!rows.length) {
    list.innerHTML = '<p class="empty">אין רשומות. לחץ "הוסף עובד"</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var opts = '<option value="">— בחר פרויקט —</option>';
    for (var pi = 0; pi < PROJECTS.length; pi++) {
      var p = PROJECTS[pi];
      var sel = (r.projectIdx !== '' && parseInt(r.projectIdx) === pi) ? 'selected' : '';
      opts += '<option value="' + pi + '" ' + sel + '>' + p.code + (p.name ? ' — ' + p.name : '') + '</option>';
    }
    html += '<div class="row-card">' +
      '<div>' +
        '<input class="r-name" type="text" placeholder="שם עובד" value="' + r.name + '" oninput="updateRow(' + i + ',\'name\',this.value)">' +
        '<select onchange="updateRow(' + i + ',\'projectIdx\',this.value)">' + opts + '</select>' +
        '<input type="number" placeholder="מספר שעות" value="' + r.hours + '" min="0" step="0.5" oninput="updateRow(' + i + ',\'hours\',this.value)">' +
      '</div>' +
      '<button class="del-btn" onclick="delRow(' + i + ')">×</button>' +
    '</div>';
  }
  list.innerHTML = html;
}

function getSummary() {
  var totals = {};
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var p = getProj(r.projectIdx);
    if (!p || !r.hours) continue;
    var key = p.code + (p.name ? ' — ' + p.name : '');
    totals[key] = (totals[key] || 0) + parseFloat(r.hours);
  }
  return totals;
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'summary') renderSummary();
}

function renderSummary() {
  // Use current rows if available, otherwise last saved rows
  var displayRows = rows.filter(function(r) { return r.name || r.projectIdx !== ''; });
  if (displayRows.length === 0) displayRows = lastSavedRows;

  var totals = {};
  for (var i = 0; i < displayRows.length; i++) {
    var r = displayRows[i];
    var p = getProj(r.projectIdx);
    if (!p || !r.hours) continue;
    var key = p.code + (p.name ? ' — ' + p.name : '');
    totals[key] = (totals[key] || 0) + parseFloat(r.hours);
  }

  var keys = Object.keys(totals);
  var sumEl = document.getElementById('summary-content');
  var allEl = document.getElementById('all-rows-content');

  if (keys.length === 0) {
    sumEl.innerHTML = '<p class="empty">אין נתונים עדיין — חזרי להזנה והוסיפי שורות</p>';
  } else {
    var html = '';
    for (var i = 0; i < keys.length; i++) {
      html += '<div class="summary-row"><span>' + keys[i] + '</span><span class="badge">' + totals[keys[i]] + ' שע\'</span></div>';
    }
    sumEl.innerHTML = html;
  }

  if (displayRows.length === 0) {
    allEl.innerHTML = '<p class="empty">אין רשומות</p>';
  } else {
    var html2 = '';
    for (var j = 0; j < displayRows.length; j++) {
      var r = displayRows[j];
      var p = getProj(r.projectIdx);
      html2 += '<div class="summary-row">' +
        '<div>' +
          '<div style="font-weight:bold">' + (r.name || '—') + '</div>' +
          '<div class="proj-code">' + (p ? p.code + (p.name ? ' — ' + p.name : '') : '—') + '</div>' +
        '</div>' +
        '<span style="font-weight:bold">' + (r.hours || 0) + ' שע\'</span>' +
      '</div>';
    }
    allEl.innerHTML = html2;
  }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; }, 3500);
}

function saveAll() {
  var date = document.getElementById('date-input').value;
  var dept = document.getElementById('dept-input').value;
  var manager = document.getElementById('manager-input').value;

  var filled = rows.filter(function(r) { return r.name && r.projectIdx !== '' && r.hours; });
  if (!filled.length) {
    showToast('יש למלא לפחות שורה אחת מלאה', 'error');
    return;
  }

  // Show summary before clearing
  lastSavedRows = filled.slice();

  var payload = {
    date: date,
    dept: dept,
    manager: manager,
    rows: filled.map(function(r) {
      var p = getProj(r.projectIdx);
      return { name: r.name, projectCode: p.code, projectName: p.name, hours: parseFloat(r.hours) };
    })
  };

  var btn = document.getElementById('save-btn');
  var msg = document.getElementById('sending-msg');
  var statusBar = document.getElementById('status-bar');
  btn.disabled = true;
  msg.style.display = 'block';
  statusBar.style.display = 'none';

  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    showToast('✓ נשמר בהצלחה ב-Google Sheets!', 'success');
    rows = [];
    render();
    document.getElementById('dept-input').value = '';
    document.getElementById('manager-input').value = '';
    document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
    statusBar.style.display = 'block';
    statusBar.textContent = '✓ הנתונים נשלחו לגיליון בהצלחה';
    statusBar.style.background = '#e6f4ea';
    statusBar.style.borderColor = '#a8d5b5';
    statusBar.style.color = '#1a6b35';
  }).catch(function() {
    showToast('שגיאה בשליחה — בדקי חיבור לאינטרנט', 'error');
    statusBar.style.display = 'block';
    statusBar.textContent = '⚠️ לא הצליח להתחבר לגיליון — נסי שוב';
  }).finally(function() {
    btn.disabled = false;
    msg.style.display = 'none';
  });
}

render();
</script>
</body>
</html>
